# Seconds between captured frames.
INTERVAL=15

# Camera snapshot endpoint. This loopback URL works with the Forge-X camera.
SNAPSHOT_URL=http://127.0.0.1:8080/?action=snapshot

# Persistent output directory. Each print gets a separate subdirectory.
OUTPUT_DIR=/data/timelapse

# Stop capturing when less than 1 GiB remains on the output filesystem.
MIN_FREE_KB=1048576
